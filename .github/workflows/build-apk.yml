name: Build ED4 Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android platform
        shell: bash
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Download DOSBox-Pure ARM64 core
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a /tmp/ed4core
          curl -fL --retry 4 --retry-delay 3             -o /tmp/ed4core/core.zip             https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/dosbox_pure_libretro_android.so.zip
          unzip -o /tmp/ed4core/core.zip -d /tmp/ed4core/unpacked
          CORE=$(find /tmp/ed4core/unpacked -type f -name '*dosbox_pure*libretro*android*.so' | head -n 1)
          test -n "$CORE"
          cp "$CORE" app/src/main/jniLibs/arm64-v8a/libdosbox_pure_libretro_android.so

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ED4-Mobile-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ED4-Mobile-test-APK
          path: ED4-Mobile-test.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ed4-mobile-build-${{ github.run_number }}"
          gh release create "$TAG" ED4-Mobile-test.apk             --repo "${{ github.repository }}"             --title "ED4 Mobile Test Build ${{ github.run_number }}"             --notes "Automatic test build for Android. Commercial game data is not included."
